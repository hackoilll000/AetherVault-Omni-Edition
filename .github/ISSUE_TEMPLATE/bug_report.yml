name: Bug Report
description: Create an evidence-backed report to help fix a verified defect
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report. Please provide exact reproduction steps and sanitized logs.
        **Do NOT include private bot tokens, channel IDs, encryption keys, or personal media files.**

  - type: input
    id: app-version
    attributes:
      label: Application Version / Commit SHA
      placeholder: e.g. v2.4-OMNI or commit hash
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      options:
        - "Media Player & Streaming"
        - "Telegram Ingest & Upload"
        - "Remote Fetch / Leeching"
        - "WASM & Workstation Viewer"
        - "Drive & File Explorer"
        - "TeleDrop / Live Stream"
        - "Encryption & Security"
        - "Build & CI Pipeline"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: Numbered sequence of actions to trigger the bug.
      placeholder: |
        1. Open Drive tab
        2. Tap on video file...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually occurred? Include error messages or unexpected states.
    validations:
      required: true

  - type: textarea
    id: sanitized-logs
    attributes:
      label: Sanitized Logcat / Diagnostics
      description: Paste relevant logs here (make sure all tokens and secrets are redacted).
