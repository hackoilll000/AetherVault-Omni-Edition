name: Multi-Store Distribution Readiness & Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/setup-gradle@v3

      - name: Run Multi-Store Metadata Validator
        run: python3 scripts/validate_distribution.py

      - name: Execute Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble Debug Universal APK
        run: gradle assembleDebug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetherVault-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
