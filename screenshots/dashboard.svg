<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="50%" stop-color="#12151F"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F2C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#121620" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Top Status Bar -->
  <text x="640" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">AETHERVAULT OMNI • DASHBOARD</text>
  <rect x="540" y="55" width="200" height="3" fill="url(#cyanGlow)" rx="1.5"/>

  <!-- Telemetry HUD Bar -->
  <rect x="80" y="90" width="1120" height="64" rx="16" fill="url(#cardGrad)" stroke="#2B374D" stroke-width="1.5"/>
  <circle cx="120" cy="122" r="8" fill="#00FF88"/>
  <text x="140" y="128" font-family="sans-serif" font-size="14" font-weight="700" fill="#00FF88">BOT SWARM ACTIVE (3/3)</text>
  <text x="500" y="128" font-family="sans-serif" font-size="14" fill="#A0AEC0">SPEED: <tspan fill="#64D2FF" font-weight="700">14.2 MB/s</tspan></text>
  <text x="800" y="128" font-family="sans-serif" font-size="14" fill="#A0AEC0">STORAGE: <tspan fill="#FFFFFF" font-weight="700">42.8 GB / ∞</tspan></text>
  <text x="1080" y="128" font-family="sans-serif" font-size="14" fill="#64D2FF">AES-256-GCM</text>

  <!-- Main Card 1: Storage Overview -->
  <rect x="80" y="180" width="540" height="260" rx="20" fill="url(#cardGrad)" stroke="#2B374D" stroke-width="1.5"/>
  <text x="120" y="230" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Zero-Knowledge Cloud Storage</text>
  <text x="120" y="260" font-family="sans-serif" font-size="14" fill="#8E9EAF">Encrypted locally &amp; sharded across Telegram channels</text>
  
  <!-- Progress Ring Mock -->
  <circle cx="220" cy="350" r="50" fill="none" stroke="#2B374D" stroke-width="12"/>
  <circle cx="220" cy="350" r="50" fill="none" stroke="url(#cyanGlow)" stroke-width="12" stroke-dasharray="250" stroke-dashoffset="75" stroke-linecap="round" transform="rotate(-90 220 350)"/>
  <text x="220" y="358" font-family="sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">74%</text>

  <text x="310" y="325" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Documents: 14.2 GB</text>
  <text x="310" y="355" font-family="sans-serif" font-size="15" font-weight="700" fill="#64D2FF">Photos &amp; Media: 21.6 GB</text>
  <text x="310" y="385" font-family="sans-serif" font-size="15" font-weight="700" fill="#A0AEC0">Archives: 7.0 GB</text>

  <!-- Main Card 2: Quick Vault Actions -->
  <rect x="660" y="180" width="540" height="260" rx="20" fill="url(#cardGrad)" stroke="#2B374D" stroke-width="1.5"/>
  <text x="700" y="230" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Quick Vault Actions</text>
  
  <!-- Action Button 1 -->
  <rect x="700" y="260" width="460" height="50" rx="12" fill="#1E293B" stroke="#00F2FE" stroke-width="1"/>
  <text x="730" y="292" font-family="sans-serif" font-size="16" font-weight="700" fill="#00F2FE">📤 Encrypt &amp; Upload Files to Telegram Cloud</text>

  <!-- Action Button 2 -->
  <rect x="700" y="325" width="460" height="50" rx="12" fill="#1E293B" stroke="#2B374D" stroke-width="1"/>
  <text x="730" y="357" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">⚡ TeleDrop Instant Snippet Stream</text>

  <!-- Bottom Quick Stats Row -->
  <rect x="80" y="470" width="1120" height="180" rx="20" fill="url(#cardGrad)" stroke="#2B374D" stroke-width="1.5"/>
  <text x="120" y="520" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Bot Swarm Cluster Health</text>
  
  <!-- Bot 1 -->
  <rect x="120" y="545" width="330" height="70" rx="12" fill="#0F172A" stroke="#00FF88" stroke-width="1"/>
  <text x="150" y="575" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Primary Vault Bot (#1)</text>
  <text x="150" y="598" font-family="sans-serif" font-size="12" fill="#00FF88">Status: Online • Latency: 42ms</text>

  <!-- Bot 2 -->
  <rect x="475" y="545" width="330" height="70" rx="12" fill="#0F172A" stroke="#00FF88" stroke-width="1"/>
  <text x="505" y="575" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Media Shard Bot (#2)</text>
  <text x="505" y="598" font-family="sans-serif" font-size="12" fill="#00FF88">Status: Online • Latency: 58ms</text>

  <!-- Bot 3 -->
  <rect x="830" y="545" width="330" height="70" rx="12" fill="#0F172A" stroke="#00FF88" stroke-width="1"/>
  <text x="860" y="575" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Backup Relay Bot (#3)</text>
  <text x="860" y="598" font-family="sans-serif" font-size="12" fill="#00FF88">Status: Online • Latency: 39ms</text>

</svg>
