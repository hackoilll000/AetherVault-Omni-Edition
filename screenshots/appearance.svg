<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="50%" stop-color="#12151F"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F2C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#121620" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Top Bar -->
  <text x="640" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">AETHERVAULT OMNI • APPEARANCE &amp; HUD STUDIO</text>
  <rect x="440" y="55" width="400" height="3" fill="url(#cyanGlow)" rx="1.5"/>

  <!-- Card 1: Theme Preset Selector -->
  <rect x="80" y="90" width="540" height="260" rx="20" fill="url(#cardGrad)" stroke="#2B374D" stroke-width="1.5"/>
  <text x="120" y="140" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Multi-UI Theme Presets</text>
  
  <rect x="120" y="170" width="220" height="60" rx="14" fill="#090A0F" stroke="#00F2FE" stroke-width="2"/>
  <text x="150" y="205" font-family="sans-serif" font-size="15" font-weight="700" fill="#00F2FE">🖤 Liquid Obsidian</text>

  <rect x="360" y="170" width="220" height="60" rx="14" fill="#12151F" stroke="#2B374D" stroke-width="1"/>
  <text x="390" y="205" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">⚡ Cyberpunk Neon</text>

  <rect x="120" y="245" width="220" height="60" rx="14" fill="#12151F" stroke="#2B374D" stroke-width="1"/>
  <text x="150" y="280" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">💎 Minimalist Quartz</text>

  <rect x="360" y="245" width="220" height="60" rx="14" fill="#12151F" stroke="#2B374D" stroke-width="1"/>
  <text x="390" y="280" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">🎨 Material Dynamic</text>

  <!-- Card 2: Corner Radius & Layout -->
  <rect x="660" y="90" width="540" height="260" rx="20" fill="url(#cardGrad)" stroke="#2B374D" stroke-width="1.5"/>
  <text x="700" y="140" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Corner Radius &amp; Grid Density</text>
  <text x="700" y="180" font-family="sans-serif" font-size="14" fill="#8E9EAF">Adjust fluid curvature for Bento cards and containers</text>
  
  <rect x="700" y="210" width="460" height="12" rx="6" fill="#1E293B"/>
  <rect x="700" y="210" width="320" height="12" rx="6" fill="url(#cyanGlow)"/>
  <circle cx="1020" cy="216" r="10" fill="#FFFFFF"/>
  <text x="700" y="255" font-family="sans-serif" font-size="14" fill="#A0AEC0">Curvature: <tspan fill="#64D2FF" font-weight="700">24 dp (Liquid iPhone Style)</tspan></text>

  <!-- Card 3: HUD Telemetry & Language -->
  <rect x="80" y="380" width="1120" height="270" rx="20" fill="url(#cardGrad)" stroke="#2B374D" stroke-width="1.5"/>
  <text x="120" y="430" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">HUD Telemetry Overlay &amp; Language / भाषा</text>
  
  <text x="120" y="475" font-family="sans-serif" font-size="15" fill="#A0AEC0">Live Telemetry Overlay (Speeds, Active Bots, Transfer Graph):</text>
  <rect x="580" y="452" width="60" height="32" rx="16" fill="#00F2FE"/>
  <circle cx="618" cy="468" r="12" fill="#090A0F"/>

  <text x="120" y="535" font-family="sans-serif" font-size="15" fill="#A0AEC0">App Language Selection:</text>
  <rect x="350" y="510" width="180" height="50" rx="12" fill="#090A0F" stroke="#00F2FE" stroke-width="2"/>
  <text x="400" y="542" font-family="sans-serif" font-size="15" font-weight="700" fill="#00F2FE">🇬🇧 English</text>

  <rect x="550" y="510" width="180" height="50" rx="12" fill="#090A0F" stroke="#2B374D" stroke-width="1"/>
  <text x="600" y="542" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">🇮🇳 हिंदी (Hindi)</text>

</svg>
