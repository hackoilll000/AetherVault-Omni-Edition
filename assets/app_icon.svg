<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Outer Rim Light -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#00F2FE" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Central Vault Shield / Lock -->
  <g filter="url(#glow)">
    <path d="M256 96 L384 144 V256 C384 340 320 408 256 432 C192 408 128 340 128 256 V144 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="256" cy="256" r="64" fill="none" stroke="url(#cyanGrad)" stroke-width="12"/>
    <path d="M256 224 V288 M224 256 H288" stroke="#00F2FE" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
