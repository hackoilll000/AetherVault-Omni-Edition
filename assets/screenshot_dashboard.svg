  <path d="M432 748 C426 748 422 744 422 739 C422 735 425 732 429 731 C430 726 434 723 439 723 C444 723 448 726 449 730 C452 731 454 734 454 737 C454 742 450 746 445 746 Z" fill="#FFFFFF"/>
