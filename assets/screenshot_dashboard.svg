    </linearGradient>
    <linearGradient id="primaryFabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D3E3FD"/>
      <stop offset="100%" stop-color="#C2E7FF"/>
    </linearGradient>
    <linearGradient id="folderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#0B57D0"/>
    </linearGradient>
    <linearGradient id="folderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B5CB"/>
      <stop offset="100%" stop-color="#007A8A"/>
