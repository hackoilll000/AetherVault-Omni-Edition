  <rect x="920" y="720" width="64" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.25"/>
  <path d="M942 748 C936 748 932 744 932 739 C932 735 935 732 939 731 C940 726 944 723 949 723 C954 723 958 726 959 730 C962 731 964 734 964 737 C964 742 960 746 955 746 Z" fill="#FFFFFF"/>
