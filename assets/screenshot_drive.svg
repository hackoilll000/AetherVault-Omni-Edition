  <text x="510" y="250" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">8 Files • 1.1 GB</text>

  <rect x="860" y="170" width="360" height="110" rx="16" fill="url(#cardBg)" stroke="rgba(0,255,102,0.4)" stroke-width="1"/>
  <text x="910" y="220" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">🖼️ Raw Photos &amp; Video</text>
  <text x="910" y="250" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">32 Files • 860 MB</text>

  <!-- Files List Section -->
  <text x="60" y="330" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Encrypted Files in Folder</text>

  <rect x="60" y="360" width="1160" height="80" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="110" y="406" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">payload_exploit_analysis.enc</text>
  <text x="600" y="406" font-family="system-ui, sans-serif" font-size="14" fill="#00F2FE">AES-256-GCM • 19.4 MB</text>
  <rect x="1020" y="380" width="160" height="40" rx="10" fill="rgba(255,0,0,0.15)" stroke="#FF4D4D" stroke-width="1"/>
  <text x="1065" y="406" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#FF4D4D">DELETE CLOUD</text>

  <rect x="60" y="460" width="1160" height="80" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="110" y="506" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">firmware_backup_v2.bin</text>
  <text x="600" y="506" font-family="system-ui, sans-serif" font-size="14" fill="#00F2FE">AES-256-GCM • 48.2 MB</text>
  <rect x="1020" y="480" width="160" height="40" rx="10" fill="rgba(255,0,0,0.15)" stroke="#FF4D4D" stroke-width="1"/>
  <text x="1065" y="506" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#FF4D4D">DELETE CLOUD</text>

  <rect x="60" y="560" width="1160" height="80" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="110" y="606" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">network_capture_pcap.enc</text>
