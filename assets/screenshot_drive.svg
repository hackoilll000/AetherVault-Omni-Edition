  </defs>
  <!-- Background with Aurora Orbs -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="800" cy="200" r="220" fill="#00F2FE" opacity="0.12" filter="url(#blurFilter)"/>
  <circle cx="300" cy="600" r="260" fill="#7F00FF" opacity="0.15" filter="url(#blurFilter)"/>

  <!-- Top App Bar & Breadcrumb -->
