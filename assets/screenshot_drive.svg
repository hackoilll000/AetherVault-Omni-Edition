  <text x="110" y="250" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">14 Files • 420 MB</text>

  <rect x="460" y="170" width="360" height="110" rx="16" fill="url(#cardBg)" stroke="rgba(127,0,255,0.4)" stroke-width="1"/>
