<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="50%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#1A102F"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <!-- Background with Aurora Orbs -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="300" cy="200" r="220" fill="#00F2FE" opacity="0.12" filter="url(#blurFilter)"/>
  <circle cx="1000" cy="500" r="260" fill="#7F00FF" opacity="0.15" filter="url(#blurFilter)"/>

  <!-- Top App Bar -->
  <rect x="60" y="40" width="1160" height="70" rx="20" fill="url(#cardBg)" stroke="rgba(0,242,254,0.3)" stroke-width="1.5"/>
  <text x="100" y="85" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#00F2FE">Photos Timeline &amp; SHA-256 Integrity</text>
  <rect x="1000" y="55" width="180" height="40" rx="12" fill="#00FF66" opacity="0.2"/>
  <text x="1025" y="81" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#00FF66">FREE UP SPACE</text>

  <!-- Photos Grid -->
  <rect x="60" y="140" width="360" height="240" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="80" y="160" width="320" height="160" rx="12" fill="#141928"/>
  <circle cx="240" cy="240" r="30" fill="#00F2FE" opacity="0.3"/>
  <text x="80" y="350" font-family="system-ui, sans-serif" font-size="13" fill="#00FF66">✓ SHA-256 Verified • Encrypted</text>

  <rect x="460" y="140" width="360" height="240" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="480" y="160" width="320" height="160" rx="12" fill="#141928"/>
  <circle cx="640" cy="240" r="30" fill="#7F00FF" opacity="0.3"/>
  <text x="480" y="350" font-family="system-ui, sans-serif" font-size="13" fill="#00FF66">✓ SHA-256 Verified • Encrypted</text>

  <rect x="860" y="140" width="360" height="240" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="880" y="160" width="320" height="160" rx="12" fill="#141928"/>
  <circle cx="1040" cy="240" r="30" fill="#00F2FE" opacity="0.3"/>
  <text x="880" y="350" font-family="system-ui, sans-serif" font-size="13" fill="#00FF66">✓ SHA-256 Verified • Encrypted</text>

  <!-- Bottom Row Photos -->
  <rect x="60" y="410" width="360" height="240" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="80" y="430" width="320" height="160" rx="12" fill="#141928"/>
  <circle cx="240" cy="510" r="30" fill="#7F00FF" opacity="0.3"/>
  <text x="80" y="620" font-family="system-ui, sans-serif" font-size="13" fill="#00FF66">✓ SHA-256 Verified • Encrypted</text>

  <rect x="460" y="410" width="360" height="240" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="480" y="430" width="320" height="160" rx="12" fill="#141928"/>
  <circle cx="640" cy="510" r="30" fill="#00F2FE" opacity="0.3"/>
  <text x="480" y="620" font-family="system-ui, sans-serif" font-size="13" fill="#00FF66">✓ SHA-256 Verified • Encrypted</text>

  <rect x="860" y="410" width="360" height="240" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="880" y="430" width="320" height="160" rx="12" fill="#141928"/>
  <circle cx="1040" cy="510" r="30" fill="#7F00FF" opacity="0.3"/>
  <text x="880" y="620" font-family="system-ui, sans-serif" font-size="13" fill="#00FF66">✓ SHA-256 Verified • Encrypted</text>
</svg>
